<body>
  <a class="skip" href="#main">К содержанию</a>
  <header class="site-head"><div class="head-inner">
    <a href="#home" class="brand" aria-label="Flightdeck, обзор"><img src="assets/nav-mark.svg" width="36" height="36" alt=""><span>Flightdeck<span class="brand-sep">/</span><span class="brand-model">737</span></span></a>

      <a class="source-button" href="#reference" aria-label="Первоисточники"><span data-icon="book-open"></span><span>Первоисточники</span></a>

  </div></header>

    <img class="share-qr" src="assets/launch-qr.png" width="164" height="164" alt="QR-код для открытия тренажёра на телефоне">
    <label for="share-url">Ссылка на эту страницу</label>
    <div class="share-fields"><input id="share-url" type="url" readonly value="https://isarnavskiy.github.io/737-fcom-trainer/"><button id="share-copy" type="button" class="btn btn-primary">Скопировать</button></div>
    <div id="share-status" aria-live="polite"></div>
  </dialog>
  <footer class="site-foot"><div><span class="foot-brand">Flightdeck / 737</span><span>Для самостоятельного изучения и домашнего симулятора.</span><a href="#reference">Первоисточники</a></div></footer>
